name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install liblz4 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblz4-1
      - name: Install liblz4 (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 || true
      - run: pip install -e ".[dev]"
      - name: Tests
        # archive-dependent tests skip automatically without HBK_TEST_ARCHIVE
        run: pytest tests -v
      - name: liblz4 is reachable
        # Windows has no system liblz4; extraction there is unverified, so we only
        # check that the package imports and the CLI runs.
        if: runner.os != 'Windows'
        run: python -c "from hbkit.archive import lz4; lz4(); print('liblz4 OK')"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
