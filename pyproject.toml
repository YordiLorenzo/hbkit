[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hbkit"
version = "0.2.1"
description = "Recover files from Synology Hyper Backup (.hbk) archives without Synology software"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YordiLorenzo", email = "yordilorenzo@gmail.com" }]
keywords = ["synology", "hyper-backup", "hbk", "backup", "recovery",
            "data-recovery", "nas", "dsm", "extract"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Recovery Tools",
]
dependencies = ["textual>=0.80", "pynacl>=1.5", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/YordiLorenzo/hbkit"
Source = "https://github.com/YordiLorenzo/hbkit"
Issues = "https://github.com/YordiLorenzo/hbkit/issues"
"Format spec" = "https://github.com/YordiLorenzo/hbkit/blob/main/FORMAT.md"

[project.scripts]
hbk = "hbkit.cli:main_entry"
hbk-tui = "hbkit.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hbkit"]

[tool.hatch.build.targets.sdist]
include = ["src/hbkit", "tests", "README.md", "FORMAT.md", "LICENSE"]
